<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charSet="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ピッチ維持 再生速度変更アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* スライダーの見た目を微調整 */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #18181b; /* zinc-900 */
            border-radius: 50%;
            cursor: pointer;
            margin-top: -6px; /* スライダーの中央に配置 */
        }
        input[type=range].dark::-webkit-slider-thumb {
            background: #f4f4f5; /* zinc-100 */
        }
        input[type=range]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #18181b; /* zinc-900 */
            border-radius: 50%;
            cursor: pointer;
        }
        input[type=range].dark::-moz-range-thumb {
             background: #f4f4f5; /* zinc-100 */
        }
    </style>
</head>
<body class="bg-background text-foreground dark:bg-zinc-900 dark:text-zinc-100">

    <div class="w-screen h-screen flex flex-col items-center justify-center" style="font-family:'Roboto Mono', monospace">
        
        <div class="flex-1"></div>
        
        <div class="w-full max-w-[640px] px-6">
            <div class="flex w-full max-w-2xl flex-col items-center gap-6">
                
                <div id="drop-zone" class="relative flex h-40 w-full cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed transition border-zinc-300 hover:border-zinc-400 dark:border-zinc-700 dark:hover:border-zinc-600">
                    <input type="file" accept="audio/*,.wav,.mp3,.ogg,.m4a,.aac,.flac" class="hidden" id="file-input"/>
                    <div class="flex items-center gap-2 text-zinc-600 dark:text-zinc-300" id="drop-zone-text">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-upload h-5 w-5" aria-hidden="true">
                            <path d="M12 3v12"></path>
                            <path d="m17 8-5-5-5 5"></path>
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        </svg>
                        <span class="text-sm">ここに音声ファイルをドラッグ＆ドロップ（クリックで選択）</span>
                    </div>
                </div>

                <div class="flex items-center justify-center">
                    <button id="play-button" class="inline-flex items-center justify-center whitespace-nowrap text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 cursor-pointer hover:bg-primary/90 focus-visible:ring-primary focus-visible:ring-offset-neutral-950 px-5 py-2.5 h-12 w-12 rounded-full bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900" disabled="" aria-label="Play">
                        <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play h-6 w-6" aria-hidden="true">
                            <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path>
                        </svg>
                        <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pause h-6 w-6 hidden" aria-hidden="true">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>
                </div>

            </div>
        </div>
        
        <div class="h-16"></div>

        <div class="flex flex-col gap-4 w-full max-w-2xl px-6">
            <!-- Seek Bar -->
            <div class="w-full">
                <input id="seek-slider" type="range" min="0" max="100" step="0.1" value="0" class="w-full h-2 bg-zinc-200 rounded-lg appearance-none cursor-pointer dark:bg-zinc-700" disabled>
                <div class="flex justify-between text-xs text-zinc-500 dark:text-zinc-400 mt-1">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <!-- Speed Control -->
            <div class="flex flex-col gap-2 w-full">
                <div class="flex items-center justify-between text-sm text-zinc-600 dark:text-zinc-400">
                    <span>× 0.25</span>
                    <span class="text-lg font-semibold text-zinc-900 dark:text-zinc-100" id="speed-display">× 2.13</span>
                    <span>× 4.0</span>
                </div>
                <input id="speed-slider" type="range" min="0.25" max="4" step="0.01" class="h-6 cursor-pointer outline-none border-none focus:accent-primary active:accent-primary w-full dark:bg-zinc-700" value="2.125"/>
            </div>
        </div>
        
        <div class="flex-1"></div>

        <!-- Audio Element (hidden) -->
        <audio id="audio-player" class="hidden"></audio>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM要素の取得 ---
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const dropZoneText = document.getElementById('drop-zone-text');
            const playButton = document.getElementById('play-button');
            const playIcon = document.getElementById('play-icon');
            const pauseIcon = document.getElementById('pause-icon');
            const speedSlider = document.getElementById('speed-slider');
            const speedDisplay = document.getElementById('speed-display');
            const seekSlider = document.getElementById('seek-slider');
            const currentTimeDisplay = document.getElementById('current-time');
            const durationDisplay = document.getElementById('duration');
            const audioPlayer = document.getElementById('audio-player');

            // --- 状態変数 ---
            // 初期再生速度
            let currentPlaybackRate = 2.125;
            
            // --- 
            // 1. ファイル処理 (ドラッグ＆ドロップ / クリック)
            // ---
            dropZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('border-blue-500', 'dark:border-blue-400');
            });
            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('border-blue-500', 'dark:border-blue-400');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('border-blue-500', 'dark:border-blue-400');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            function handleFile(file) {
                // ファイルバリデーションの緩和
                // file.typeがaudio/系であるか、または拡張子が一般的な音声ファイルであることを確認
                const validExtensions = ['.wav', '.mp3', '.ogg', '.m4a', '.aac', '.flac'];
                const isAudioType = file.type.startsWith('audio/');
                const isAudioExtension = validExtensions.some(ext => file.name.toLowerCase().endsWith(ext));

                if (!file || (!isAudioType && !isAudioExtension)) {
                    alert('音声ファイルを選択してください。');
                    return;
                }

                // 既存のURLを解放
                if (audioPlayer.src) {
                    URL.revokeObjectURL(audioPlayer.src);
                    audioPlayer.src = "";
                }

                // UIのリセット
                dropZoneText.textContent = `読み込み中: ${file.name}`;
                playButton.disabled = true;
                seekSlider.disabled = true;

                const objectUrl = URL.createObjectURL(file);
                audioPlayer.src = objectUrl;

                audioPlayer.load();
            }

            // --- オーディオイベントリスナー ---

            // メタデータ読み込み完了時にUIを更新
            audioPlayer.onloadedmetadata = () => {
                // ファイル名を取得するために、file-inputまたはdropイベントのスコープにあるfileが必要だが、
                // ここでは非同期イベントなので、今のテキスト内容からファイル名だけ抽出するか、
                // あるいはグローバル変数にファイル名を保存する必要がある。
                // 簡易的に、現在のテキストが「読み込み中: filename」となっていることを利用して置換する、
                // または handleFile で保存した変数を使う。

                // シンプルに「読み込み完了」とするか、ファイル名を保持するか。
                // UXとしてはファイル名があったほうがいい。
                // しかし、handleFileのスコープ外。
                // audioPlayer.src は blob:URL なのでファイル名はわからない。

                // 暫定対応: もしdropZoneTextにファイル名が含まれていればそれを維持する
                const currentText = dropZoneText.textContent;
                const match = currentText.match(/読み込み中: (.+)/);
                if (match) {
                    dropZoneText.textContent = `読み込み完了: ${match[1]}`;
                } else {
                    dropZoneText.textContent = `読み込み完了`;
                }

                playButton.disabled = false;
                seekSlider.disabled = false;
                seekSlider.max = audioPlayer.duration;
                durationDisplay.textContent = formatTime(audioPlayer.duration);

                // 設定済みの再生速度を適用
                audioPlayer.playbackRate = currentPlaybackRate;
                // ピッチ維持を有効化
                if (audioPlayer.preservesPitch !== undefined) {
                    audioPlayer.preservesPitch = true;
                } else if (audioPlayer.mozPreservesPitch !== undefined) {
                    audioPlayer.mozPreservesPitch = true;
                } else if (audioPlayer.webkitPreservesPitch !== undefined) {
                    audioPlayer.webkitPreservesPitch = true;
                }
            };

            // エラーハンドリング
            audioPlayer.onerror = (e) => {
                console.error("Audio Load Error:", e);
                const error = audioPlayer.error;
                let msg = "読み込みエラー";
                if (error) {
                    if (error.code === 1) msg = "中断されました";
                    else if (error.code === 2) msg = "ネットワークエラー";
                    else if (error.code === 3) msg = "デコードエラー";
                    else if (error.code === 4) msg = "非対応の形式です";
                }

                dropZoneText.textContent = `エラー: ${msg}`;
                alert(`音声ファイルの読み込みに失敗しました: ${msg} (Code: ${error ? error.code : 'unknown'})`);

                // クリーンアップ
                playButton.disabled = true;
                seekSlider.disabled = true;
            };

            // ---
            // 2. 再生 / 一時停止 処理
            // ---
            playButton.addEventListener('click', togglePlayPause);

            function togglePlayPause() {
                if (audioPlayer.paused) {
                    audioPlayer.play().catch(e => {
                        console.error('再生エラー:', e);
                        alert(`再生できませんでした: ${e.message}`);
                    });
                } else {
                    audioPlayer.pause();
                }
            }

            audioPlayer.addEventListener('play', () => updatePlayButtonUI(true));
            audioPlayer.addEventListener('pause', () => updatePlayButtonUI(false));
            audioPlayer.addEventListener('ended', () => {
                updatePlayButtonUI(false);
                seekSlider.value = 0;
                currentTimeDisplay.textContent = formatTime(0);
            });

            function updatePlayButtonUI(playing) {
                if (playing) {
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                    playButton.setAttribute('aria-label', 'Pause');
                } else {
                    playIcon.classList.remove('hidden');
                    pauseIcon.classList.add('hidden');
                    playButton.setAttribute('aria-label', 'Play');
                }
            }

            // --- 
            // 3. 速度変更スライダー
            // ---
            speedSlider.addEventListener('input', (e) => {
                currentPlaybackRate = parseFloat(e.target.value);
                speedDisplay.textContent = `× ${currentPlaybackRate.toFixed(2)}`;
                
                // srcが設定されている場合のみ適用（エラー回避）
                if (audioPlayer.currentSrc) {
                    audioPlayer.playbackRate = currentPlaybackRate;
                }
            });

            // ---
            // 4. Seek Bar Logic
            // ---
            seekSlider.addEventListener('input', (e) => {
                const newTime = parseFloat(e.target.value);
                currentTimeDisplay.textContent = formatTime(newTime);
                if (audioPlayer.currentSrc) {
                    audioPlayer.currentTime = newTime;
                }
            });

            audioPlayer.addEventListener('timeupdate', () => {
                // スライダー操作中は更新しないほうが操作しやすい
                if (document.activeElement !== seekSlider) {
                    seekSlider.value = audioPlayer.currentTime;
                    currentTimeDisplay.textContent = formatTime(audioPlayer.currentTime);
                }
            });

            function formatTime(seconds) {
                if (isNaN(seconds)) return "0:00";
                const minutes = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${minutes}:${secs.toString().padStart(2, '0')}`;
            }

            // 初期値の反映
            speedSlider.value = currentPlaybackRate;
            speedDisplay.textContent = `× ${currentPlaybackRate.toFixed(2)}`;
        });
    </script>

</body>
</html>
